name: harcliklarim
description: "Sandık: Harçlıklarım — çocuklar için birikim ve para bilinci (7–15 yaş)."
publish_to: 'none'
# Sürüm fastlane tarafından CI'da yükseltilir (sandık ile aynı düzen);
# elle bump etme.
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  http: ^1.2.1
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  # SVG yol dizelerini Flutter Path'e çevirir — karakterler CustomPainter ile
  # çizilir (flutter_svg pattern/filter desteklemediği için SVG dosyası yok).
  path_drawing: ^1.0.1
  crypto: ^3.0.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dersler/
    # Ses efektleri: CC0 kayıtlar, kaynaklar assets/sesler/LISANS.md.
    - assets/sesler/
    # 3D karakterler (deneme): Blender'da önceden render, animasyonlu WebP.
    # Üretim tool/karakter3d/ (README). Veli köşesinden açılır.
    - assets/karakter3d/acilis/
    - assets/karakter3d/altin/
    - assets/karakter3d/dolar/
    - assets/karakter3d/euro/
    - assets/karakter3d/nakit/
    - assets/fonts/OFL-Baloo2.txt
    - assets/fonts/OFL-Nunito.txt
  # Yazı tipleri pakete gömülü (Kids kategorisi: çalışma zamanında ağdan font
  # çekilmez). Değişken fontlardan statik ağırlıklar üretildi; Flutter değişken
  # eksenini fontWeight ile her platformda güvenilir sürmüyor.
  # Baloo 2 = başlık (yuvarlak, kalın; Fredoka ğ/ş/İ/₺ içermediği için elendi),
  # Nunito = gövde. İkisi de SIL OFL; lisans metni assets'te, LicenseRegistry'de.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
