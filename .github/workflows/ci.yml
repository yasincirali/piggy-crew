name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: l10n çıktısı commit'li mi?
        run: git diff --exit-code -- lib/l10n/generated
      - run: flutter analyze
      - run: flutter test
